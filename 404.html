<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sayfa bulunamadı — SLVNZ</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

<!-- Bu sayfa herhangi bir derinlikteki adres için sunulur (/a/b/c/), o yüzden
     buradaki yollar göreli değil kök-mutlak. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;400;500&family=Space+Grotesk:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
<script>
  /* runs before first paint: restore the saved theme so there is no flash */
  (function(){try{var t=localStorage.getItem("slvnz-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
</head>

<body>
<div class="page">

  <header class="page__head">
    <p class="eyebrow">Masaüstü Rol Yapma Sistemi</p>
  </header>

  <main class="page__body page__body--center" id="icerik">
    <section class="notfound">
      <p class="notfound__code">404</p>
      <h1 class="notfound__title">Bu sayfa yok</h1>
      <p class="notfound__lede">Aradığın sayfa taşınmış ya da hiç yazılmamış olabilir.</p>
      <p><a class="notfound__back" href="/">Başa dön</a></p>
    </section>
  </main>

  <footer class="page__foot">
    <button class="theme-toggle" type="button" data-theme-toggle role="switch" aria-checked="false" aria-label="Karanlık mod">
      <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
      <span class="theme-toggle__track" aria-hidden="true"></span>
      <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13.5A8.5 8.5 0 1 1 10.5 4a6.6 6.6 0 0 0 9.5 9.5z"/></svg>
    </button>
    <p class="copyright"><span aria-hidden="true">©</span> 2026 SLVNZ</p>
  </footer>

</div>
<script src="/assets/js/theme.js" defer></script>
</body>
</html>
