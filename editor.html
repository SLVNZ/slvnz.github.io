<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLVNZ 4.0 — Editör</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <!-- ====================================================================
       OFFLINE ADMIN / EDİTÖR
       --------------------------------------------------------------------
       Sunucu gerektirmez. Tüm değişiklikler tarayıcına (localStorage)
       kaydedilir ve site (index.html) bunları otomatik kullanır.
       Kalıcı kaynak güncellemesi için "content.js olarak kopyala" ile
       çıktıyı alıp content.js dosyasına yapıştırabilirsin.
       ==================================================================== -->
  <div class="ed-body" id="edRoot"></div>

  <!-- content.js -> varsayılan içerik; content-rules.js -> kurallar içeriği; editor.js -> panel mantığı -->
  <script src="content.js"></script>
  <script src="content-rules.js"></script>
  <script src="editor.js"></script>
</body>
</html>
