<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://use.typekit.net/jze1rws.css">
<title>SLVNZ FANTAZYA - OYUN KURALLARI</title>
<link href="slvnz.css" rel="stylesheet" type="text/css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
	
	@media screen and (max-width: 600px) {
	#cards-contain {
		flex-direction: column !important;
	}
}
</style>

</head>

<body>

	<section style="display: flex; flex-direction: row; justify-content: flex-start; width: 100%;">

		<div class="header">

			<a href="index.html">

				<img src="resources/webpage/svg/slvnz-fantazya-header.svg" alt="">

			</a>

		</div>

		<div class="header-menu" style="padding-left: 50px; border-left: 1px dotted firebrick;">

			<a href="game-rules.html">OYUN KURALLARI</a>

			<a href="game-skills.html" style="color: #d9d9d9; font-weight: bold;">YETENEKLER</a>

			<a href="game-guide.html">EVREN REHBERİ</a>

		</div>

	</section>
	
	<a href="index.html">
		<button class="nav-button" style="position: absolute; left: 2%; top: 15%;"><span style="transform: rotate(180deg);">➜</span></button>
	</a>

	<div class="page-marker">

			<label>YETENEKLER</label>

	</div>
	
	<section class="page-panel" style="flex-direction: column;">

		<div class="page-panel-header-menu">

			<button data-target="skills-energy">ENERJİSEL YETENEKLER</button>
			<button data-target="skills-physical">FİZİKSEL YETENEKLER</button>			
			<button data-target="skills-battleart">SAVAŞ SANATLARI</button>

			
		</div>

		<div style="display: flex; flex-direction: row; width: 100%; justify-content: center;">
			<p style="width: 60%;">
				Bu alanda yer alan bütün yetenekler, evrende yaygın olarak karşılaşılabilen arketipleri belirtir. Bir karakter seçeceği yetenekler konusunda burada göreceği sistem ve kuvvetleri baz alarak liste dışı yaratıcı fikirlerini bir yetenek olarak elde edebilir.
			</p>
		</div>

		<div class="page-panel-interior-full" id="skills-energy">

			

		</div>


	</section>



	<script>
		document.addEventListener("DOMContentLoaded", () => {
			const defaultTarget = "game-system";
			const section = document.querySelector(".page-panel");
			if (section) {
				const panel = section.querySelector(`.page-panel-content#${CSS.escape(defaultTarget)}`);
				if (panel) panel.classList.add("active");
				const btn = section.querySelector(`.side-menu-button[data-target="${defaultTarget}"]`);
				if (btn) btn.classList.add("active");
			}
		});

		document.addEventListener("click", (e) => {
		const btn = e.target.closest(".side-menu-button");
		if (!btn) return;

		const section = btn.closest(".page-panel");
		if (!section) return;

		const targetId = btn.dataset.target;
		if (!targetId) return;

		// Bu section içindeki tüm panelleri kapat
		section.querySelectorAll(".page-panel-content.active")
			.forEach(p => p.classList.remove("active"));

		// Bu section içindeki tüm butonlardan active kaldır
		section.querySelectorAll(".side-menu-button.active")
			.forEach(b => b.classList.remove("active"));

		// Hedef paneli aç
		const panel = section.querySelector(`.page-panel-content#${CSS.escape(targetId)}`);
		if (panel) panel.classList.add("active");

		// Hedef butonu active yap
		btn.classList.add("active");
		});

		document.addEventListener("DOMContentLoaded", () => {
		const menu = document.querySelector(".page-panel-content-child-menu");
		if (!menu) return;

		const buttons = Array.from(menu.querySelectorAll("button[data-target]"));
		const panels  = Array.from(document.querySelectorAll(".page-panel-content-child"));

		const setActive = (targetId) => {
			// Panelleri kapat
			panels.forEach(p => p.classList.remove("active"));

			// Hedef paneli aç
			const targetPanel = document.getElementById(targetId);
			if (targetPanel) targetPanel.classList.add("active");

			// Buton active yönetimi
			buttons.forEach(b => b.classList.remove("active"));
			const activeBtn = menu.querySelector(`button[data-target="${CSS.escape(targetId)}"]`);
			if (activeBtn) activeBtn.classList.add("active");
		};

		// Tıklamalar (event delegation)
		menu.addEventListener("click", (e) => {
			const btn = e.target.closest("button[data-target]");
			if (!btn || !menu.contains(btn)) return;

			const targetId = btn.dataset.target;
			if (!targetId) return;

			setActive(targetId);
		});

		// Default: hex-battle (varsa), yoksa ilk buton
		const defaultId = "hex-battle";
		const hasDefault = !!document.getElementById(defaultId);
		const initialId = hasDefault ? defaultId : (buttons[0]?.dataset.target);

		if (initialId) setActive(initialId);
		});

		document.addEventListener("DOMContentLoaded", () => {
		// Her .page-panel-content kendi içinde yönetilsin (aynı sayfada birden fazla panel olsa da çalışır)
		const containers = document.querySelectorAll(".page-panel-content");

		containers.forEach((container) => {
			const menu = container.querySelector(".page-panel-content-child-menu");
			if (!menu) return;

			const buttons = Array.from(menu.querySelectorAll("button[data-target]"));
			const panels = Array.from(container.querySelectorAll(".page-panel-content-child"));

			const setActive = (targetId) => {
			// Panelleri kapat
			panels.forEach((p) => p.classList.remove("active"));

			// Hedef paneli aç (aynı container içinden arar)
			const targetPanel = container.querySelector(`#${CSS.escape(targetId)}.page-panel-content-child`);
			if (targetPanel) targetPanel.classList.add("active");

			// Buton active güncelle
			buttons.forEach((b) => b.classList.remove("active"));
			const activeBtn = menu.querySelector(`button[data-target="${CSS.escape(targetId)}"]`);
			if (activeBtn) activeBtn.classList.add("active");
			};

			// Click (event delegation)
			menu.addEventListener("click", (e) => {
			const btn = e.target.closest("button[data-target]");
			if (!btn || !menu.contains(btn)) return;

			const targetId = btn.dataset.target;
			if (!targetId) return;

			setActive(targetId);
			});

			// Default: data-default varsa onu aç; yoksa ilk butonun hedefini aç
			const defaultId =
			menu.getAttribute("data-default") ||
			buttons[0]?.dataset.target;

			if (defaultId) setActive(defaultId);
		});
		});

		document.addEventListener("DOMContentLoaded", () => {

			const headerMenus = document.querySelectorAll(".page-panel-header-menu");

			headerMenus.forEach(menu => {

				const buttons = Array.from(menu.querySelectorAll("button[data-target]"));

				// Menüye en yakın kapsayıcıyı referans alıyoruz
				const container = menu.parentElement;

				const panels = Array.from(
					container.querySelectorAll(".page-panel-interior-full")
				);

				const setActive = (targetId) => {

					// Panelleri kapat
					panels.forEach(p => p.classList.remove("active"));

					// Hedef paneli aç
					const targetPanel = container.querySelector(
						`#${CSS.escape(targetId)}.page-panel-interior-full`
					);

					if (targetPanel) {
						targetPanel.classList.add("active");
					}

					// Buton active güncelle
					buttons.forEach(b => b.classList.remove("active"));

					const activeBtn = menu.querySelector(
						`button[data-target="${CSS.escape(targetId)}"]`
					);

					if (activeBtn) {
						activeBtn.classList.add("active");
					}
				};

				// Click event
				menu.addEventListener("click", (e) => {

					const btn = e.target.closest("button[data-target]");
					if (!btn) return;

					setActive(btn.dataset.target);

				});

				// Default olarak ilk butonu aç
				if (buttons.length > 0) {
					setActive(buttons[0].dataset.target);
				}

			});

		});


	</script>



	
</body>






</html>
